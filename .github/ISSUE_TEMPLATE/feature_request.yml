name: Idea
description: Suggest something Hafen could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation and what is missing, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Hafen help?
