# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Packages and releases are built on request only:
  # gh workflow run ci.yml --ref <branch or tag> [-f release=true]
  workflow_dispatch:
    inputs:
      release:
        description: Publish the packages as a GitHub release (start the run on the tag vX.Y.Z)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    # KF6 and Qt ≥ 6.5 are not in the runner's own Ubuntu, so the build runs in the release it packages for.
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["26.04", "26.10"]
    steps:
      - name: Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates cmake ninja-build g++ dpkg-dev file nodejs \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-l10n-tools \
            libkirigami-dev libkf6statusnotifieritem-dev libkf6dbusaddons-dev \
            appstream desktop-file-utils \
            dbus-daemon fonts-dejavu-core qml6-module-qttest \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtcore qml6-module-qtqml qml6-module-qtqml-models
      - uses: actions/checkout@v7
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Validate metadata
        run: |
          desktop-file-validate data/io.github.bdgraue.Hafen.desktop
          appstreamcli validate --no-net data/io.github.bdgraue.Hafen.metainfo.xml
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build
      - name: UI tests
        # Offscreen, on its own D-Bus and against a fake docker (tests/ui/bin/docker).
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-ubuntu-${{ matrix.ubuntu }}
          path: build/tests/ui/artifacts/*.png
          if-no-files-found: ignore
      - name: Release runs on the tag of this version
        if: github.event_name == 'workflow_dispatch' && inputs.release
        # Started on a branch, `gh release create` would turn the branch name into a new tag.
        # The container has no display; QApplication needs a platform even for --version.
        env:
          QT_QPA_PLATFORM: offscreen
        run: test "$GITHUB_REF" = "refs/tags/v$(./build/hafen --version | sed 's/^hafen //')"
      - name: Package
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd build
          cpack -G DEB
          version=$(. /etc/os-release && echo "$VERSION_ID")
          for deb in *.deb; do mv "$deb" "${deb%_amd64.deb}_ubuntu${version}_amd64.deb"; done
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: hafen-ubuntu-${{ matrix.ubuntu }}
          path: build/*.deb

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --title "Hafen ${GITHUB_REF_NAME#v}" --generate-notes
